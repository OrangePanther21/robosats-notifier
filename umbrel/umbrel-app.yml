manifestVersion: 1
id: robosats-notifier
category: finance
name: RoboSats Notifier
version: "1.3.0"
tagline: Get instant notifications for new RoboSats offers
description: >-
  **Unofficial community tool** - Monitor RoboSats order book and receive instant notifications when new offers match your criteria.
  
  This is an independent community project, not officially affiliated with RoboSats.
  
  Features:
  - Real-time monitoring of RoboSats offers across multiple coordinators
  - Instant notifications for new matching offers (WhatsApp supported)
  - Daily summary reports with BTC prices and offer statistics
  - Web UI for easy configuration
  - QR code authentication
  - Filter by currencies and coordinators
  - Customizable check intervals
  
  Requirements:
  - RoboSats app must be installed
  - Messaging account for notifications (WhatsApp currently supported)
  
  Configuration:
  - Access the web UI on port 12597
  - Scan QR code to authenticate
  - Configure your target currencies and notification settings
  - Adjust check interval and other settings
developer: Community Contributor
website: https://github.com/OrangePanther21/robosats-notifier
dependencies:
  - robosats
repo: https://github.com/OrangePanther21/robosats-notifier
support: https://github.com/OrangePanther21/robosats-notifier/issues
port: 12597
gallery:
  - https://raw.githubusercontent.com/OrangePanther21/robosats-notifier/main/docs/screenshots/screenshot-1.jpg
  - https://raw.githubusercontent.com/OrangePanther21/robosats-notifier/main/docs/screenshots/screenshot-2.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
permissions:
  - STORAGE_DOWNLOADS
submitter: Community Contributor
submission: https://github.com/getumbrel/umbrel-apps
releaseNotes: >-
  Version 1.3.0 - Daily Summary Feature
  
  New Features:
  - Daily Summary: Receive scheduled daily reports with BTC prices, offer statistics, and coordinator health
  - Configurable summary time and timezone via web UI
  - Support for multiple BTC price currencies with 24h price movement
  - Volume statistics per coordinator
  - Customizable closing messages
  - Reset statistics endpoint for data management
  
  Improvements:
  - Upgraded whatsapp-web.js to v1.34.6
  - Improved timezone handling and error logging
  - Better rate limiting for external API calls
  - Enhanced stats tracking with hourly bucket rotation
